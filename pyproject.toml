[project]
name = "rag-for-inif"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mehdi-pour-samimi", email = "mehdi.poursamimi@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.16.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openrouter>=0.3.0",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
rag-for-inif = "rag_for_inif:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
